name: Azure Static Web Apps V3 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - autovisa-v3

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy V3
    steps:
      - uses: actions/checkout@v4

      - name: Build And Deploy V3
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AUTOVISA_V3 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: "api"
          output_location: ""
          config_file_location: "/"