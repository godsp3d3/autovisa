<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Autovisa</title>
    <style>
        body {
            padding: 30px;
            font-family: sans-serif;
        }

        .quiz-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            margin-top: 30px;
        }

        .image-box {
            flex: 1;
        }

        .image-box img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
        }

        .controls {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Autovisa</h1>

    <label for="count">Kuinka monta autoa haluat tunnistaa?</label>
    <input type="number" id="count" min="1" max="50" value="20">
    <button onclick="startQuiz()">Aloita</button>
    <button onclick="resetAndStart()">Aloita alusta</button>
    <hr>

    <p id="loader" style="display:none;">Odota hetki, kuvia ladataan...</p>

    <div id="quiz" style="display:none;">
        <p><strong>Kuva <span id="currentIndex">1</span> / <span id="totalCount">?</span></strong></p>

        <div class="quiz-container">
            <div class="image-box">
                <img id="cropped" src="" alt="Rajattu kuva">
            </div>
            <div class="image-box">
                <img id="full" src="" alt="Koko kuva" style="display:none;">
            </div>
        </div>

        <div class="controls">
            <button onclick="reveal()">Näytä koko kuva</button>
            <button onclick="nextImage()">Seuraava kuva</button>
        </div>
    </div>

<script>
    let imageList = [];
    let current = 0;

    async function startQuiz() {
        const count = parseInt(document.getElementById("count").value);
        if (isNaN(count) || count <= 0) {
            alert("Anna kelvollinen määrä kuvia (1-50).");
            return;
        }

        document.getElementById("loader").style.display = "block";

        imageList = [];
        current = 0;

        const seenPixabayIds = new Set();

        document.getElementById("quiz").style.display = "none";
        document.getElementById("cropped").src = "";
        document.getElementById("full").src = "";

        // Fetch extra attempts because duplicates and failed images are filtered out.
        const maxFetches = count * 3;

        for (let i = 0; i < maxFetches; i++) {
            if (imageList.length >= count) break;

            try {
                const response = await fetch("/api/fetchCarImages");
                const data = await response.json();

                if (!response.ok) {
                    console.error("API error:", data);
                    continue;
                }

                if (!data.cropped_image_url || !data.full_image_url) {
                    console.error("Invalid image payload:", data);
                    continue;
                }

                if (seenPixabayIds.has(data.pixabay_id)) {
                    console.log("Duplicate Pixabay image skipped:", data.pixabay_id);
                    continue;
                }

                seenPixabayIds.add(data.pixabay_id);
                imageList.push(data);

            } catch (e) {
                console.error("Kuvan haku epäonnistui:", e);
            }
        }

        document.getElementById("loader").style.display = "none";

        if (imageList.length === 0) {
            alert("Yhtään kelvollista autokuvaa ei saatu ladattua.");
            return;
        }

        document.getElementById("totalCount").textContent = imageList.length;
        document.getElementById("quiz").style.display = "block";
        showImage();
    }

    async function resetAndStart() {
        try {
            const response = await fetch("/api/resetQuiz", { method: "POST" });
            if (response.ok) {
                startQuiz();
            } else {
                alert("Virhe tyhjentäessä kuvia.");
            }
        } catch (e) {
            alert("Yhteysvirhe: " + e.message);
        }
    }

    function showImage() {
        const data = imageList[current];

        if (!data || !data.cropped_image_url || !data.full_image_url) {
            alert("Kuvan tiedot puuttuvat.");
            return;
        }

        document.getElementById("currentIndex").textContent = current + 1;
        document.getElementById("cropped").src = data.cropped_image_url + "?t=" + Date.now();
        document.getElementById("full").src = data.full_image_url + "?t=" + Date.now();
        document.getElementById("full").style.display = "none";
    }

    function reveal() {
        document.getElementById("full").style.display = "block";
    }

    function nextImage() {
        if (current < imageList.length - 1) {
            current++;
            showImage();
        } else {
            alert("Autovisa on suoritettu!");
            document.getElementById("quiz").style.display = "none";
        }
    }
</script>
</body>
</html>
