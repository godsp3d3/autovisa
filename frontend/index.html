<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Autovisa</title>
</head>
<body>
    <h1>Arvaa auton merkki tai malli</h1>

    <button onclick="loadImage()">Uusi kuva</button><br><br>

    <img id="cropped" src="" alt="Rajattu kuva" width="300"><br><br>

    <input type="text" id="guess" placeholder="Arvauksesi"><br><br>
    <button onclick="reveal()">Näytä koko kuva</button><br><br>

    <img id="full" src="" alt="Koko kuva" style="display:none;" width="500">

    <script>
        async function loadImage() {
            try {
                const response = await fetch("/api/fetchCarImages");
                if (!response.ok) throw new Error("Virhe haettaessa kuvaa.");
                const data = await response.json();
                const timestamp = new Date().getTime(); 
                document.getElementById("cropped").src = data.cropped_image_url;
                document.getElementById("full").src = data.full_image_url;
                document.getElementById("full").style.display = "none"; // piilota täysi kuva
            } catch (error) {
                alert("Kuvien lataus epäonnistui: " + error.message);
            }
        }

        function reveal() {
            document.getElementById("full").style.display = "block";
        }

        loadImage();
    </script>
</body>
</html>
