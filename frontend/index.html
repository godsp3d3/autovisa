<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Autovisa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px 40px; /* <-- Sivun reunoille väliä */
      background-color: #f2f2f2;
    }

    .image-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-top: 20px;
    }

    .image-box {
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      flex: 1;
      max-width: 48%;
    }

    .image-box img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <h1>Autovisa</h1>

  <div class="image-container">
    <div class="image-box">
      <h3>Rajattu kuva</h3>
      <img id="cropped-image" src="" alt="Rajattu auto">
    </div>
    <div class="image-box">
      <h3>Kokokuva</h3>
      <img id="full-image" src="" alt="Koko auto">
    </div>
  </div>

  <button class="button" onclick="startNewQuiz()">Aloita uusi visa</button>

  <script>
    async function startNewQuiz() {
      try {
        const reset = await fetch("/api/resetQuiz", { method: "POST" });
        if (!reset.ok) throw new Error("Reset epäonnistui");

        const res = await fetch("/api/fetchCarImages", { method: "POST" });
        const data = await res.json();

        document.getElementById("cropped-image").src = data.cropped_image_url;
        document.getElementById("full-image").src = data.full_image_url;
      } catch (err) {
        alert("Virhe: " + err.message);
      }
    }

    // Käynnistä automaattisesti ensimmäinen visa
    startNewQuiz();
  </script>
</body>
</html>
